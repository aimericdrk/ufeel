name: Third-party Git LFS files
description: Fetches the 3rdparty Git LFS files, restoring .git/lfs/objects from the Actions cache and saving it right after a fetch.

inputs:
  include:
    description: Paths to fetch.
    required: false
    default: "3rdparty/**"
  exclude:
    description: Paths to skip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Compute Git LFS cache key
      id: key
      shell: bash
      env:
        INCLUDE: ${{ inputs.include }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        hash="$(git ls-files -s -- ':(glob)3rdparty/**/*.so' ':(glob)3rdparty/**/*.a' ':(glob)3rdparty/**/*.dylib' | shasum -a 256 | cut -c1-16)"
        paths="$(printf '%s\n' "$INCLUDE" "$EXCLUDE" | shasum -a 256 | cut -c1-8)"
        echo "key=lfs-3rdparty-$hash-$paths" >> "$GITHUB_OUTPUT"

    - name: Restore Git LFS objects
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: .git/lfs/objects
        key: ${{ steps.key.outputs.key }}

    - name: Fetch Git LFS files
      shell: bash
      env:
        INCLUDE: ${{ inputs.include }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        options=(--include="$INCLUDE")
        [[ -z "$EXCLUDE" ]] || options+=(--exclude="$EXCLUDE")
        git lfs pull "${options[@]}"

    - name: Save Git LFS objects
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .git/lfs/objects
        key: ${{ steps.key.outputs.key }}
